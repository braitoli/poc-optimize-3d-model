name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: E2E Pipeline Tests (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libstdc++6

      - name: Cache basisu binary
        id: cache-basisu
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/basisu
          key: basisu-ubuntu-${{ runner.os }}-v1

      - name: Build & Install basisu CLI
        if: steps.cache-basisu.outputs.cache-hit != 'true'
        run: |
          echo "Building basisu from source..."
          git clone --depth 1 https://github.com/BinomialLLC/basis_universal.git /tmp/basis_universal
          cd /tmp/basis_universal
          cmake -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build --parallel $(nproc)
          if [ -f bin/basisu ]; then
            sudo cp bin/basisu /usr/local/bin/basisu
          else
            sudo cp build/bin/basisu /usr/local/bin/basisu
          fi
          sudo chmod +x /usr/local/bin/basisu
          rm -rf /tmp/basis_universal

      - name: Verify basisu CLI
        run: |
          basisu -version

      - name: Run automated setup.sh
        run: |
          bash setup.sh

      - name: Run Pytest Suite (Rule 11 Zero-Decimation Verification)
        run: |
          source .venv/bin/activate
          pytest tests/ -v

      - name: Run CLI E2E Pipeline Verification
        run: |
          source .venv/bin/activate
          # Generate sample mock GLB
          python3 -c "from tests.fixtures import create_mock_glb; from pathlib import Path; create_mock_glb(Path('sample_ci_input.glb'))"
          # Run CLI wrapper
          ./bin/optimize-3d sample_ci_input.glb sample_ci_opt.glb
          # Verify output
          test -s sample_ci_opt.glb
          echo "✅ CLI E2E verification passed: $(ls -lh sample_ci_opt.glb)"

  docker-build:
    name: Docker Container Build & E2E Test
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: braitoli/poc-optimize-3d:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Container Execution
        run: |
          mkdir -p data
          # Create mock GLB using container environment
          docker run --rm --entrypoint python3 -v $(pwd)/data:/data braitoli/poc-optimize-3d:ci -c "from pathlib import Path; from tests.fixtures import create_mock_glb; create_mock_glb(Path('/data/input.glb'))"
          # Execute container via volume mount
          docker run --rm -v $(pwd)/data:/data braitoli/poc-optimize-3d:ci /data/input.glb /data/output.glb
          # Verify containerized output
          test -s data/output.glb
          echo "✅ Docker container E2E execution verified successfully!"
